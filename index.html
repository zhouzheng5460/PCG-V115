<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TownForge — F3 城市生成器</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <span class="logo">◈</span>
          <span>TownForge</span>
          <em>F3 规则城市</em>
        </div>
        <!--
          两个页签 = 两套相机（同一个场景、同一份几何）：
            persp = 透视 + 阴影（三维预览）
            top   = 正交俯视 + 关阴影（原来的"平面编辑"）
          选中 / 高亮 / 禁区 / 方向线都在三维场景里，两边看到的是同一个东西。
        -->
        <div class="views">
          <button class="tab active" data-view="persp">透视</button>
          <button class="tab" data-view="top">顶视</button>
        </div>
        <div class="actions">
          <button id="btn-fit" class="ghost">全城</button>
          <button id="btn-export-top" class="primary">导出 GLB</button>
        </div>
      </header>

      <div id="body">
        <aside id="leftbar"></aside>

        <main id="stage">
          <div id="view3d"></div>
          <!-- 编辑与重建分离：改禁区 / 方向线 / 街区覆盖只改状态，按这里才真重建 -->
          <div id="applybar">
            <span class="txt"></span>
            <button id="btn-apply" class="primary">应用并重建</button>
            <button id="btn-discard" class="ghost">放弃</button>
          </div>
          <div id="hint"></div>
          <div id="stats"></div>
          <div id="busy"></div>
          <div id="notes"></div>
        </main>

        <aside id="rightbar"></aside>
      </div>
    </div>
    <script type="module" src="/src/ui/app.ts"></script>
  </body>
</html>
